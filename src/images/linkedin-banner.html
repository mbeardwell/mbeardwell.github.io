<html>
	<head>
		<style>
			.bw{width:100%;overflow:hidden;}
			.bn{width:1584px;height:396px;position:relative;overflow:hidden;background:{{COLOR:surface}};font-family:Georgia,'Times New Roman',serif;display:flex;align-items:center;}
			.wm{position:absolute;left:1200px;top:50%;transform:translateY(-50%);width:420px;height:700px;opacity:0.08;color:{{COLOR:accent}};}
			.wm svg{width:100%;height:100%;}
			.logo{position:absolute;top:40px;left:40px;width:80px;height:80px;color:{{COLOR:accent}};}
			.logo svg{width:100%;height:100%;}
			.stats{display:flex;flex-direction:row;align-items:flex-start;width:100%;padding-left:528px;padding-right:80px;gap:56px;}
			.stat{display:flex;flex-direction:column;gap:14px;border-top:2px solid {{COLOR:accent}};padding-top:20px;flex:1;}
			.sn{font-size:82px;line-height:1;color:{{COLOR:content}};font-weight:700;letter-spacing:-0.03em;}
			.sl{font-size:25px;letter-spacing:0.08em;text-transform:uppercase;color:{{COLOR:content}};opacity:0.45;line-height:1.45;}
			.dv{width:1px;background:rgba(245,248,254,0.22);align-self:stretch;margin:0 56px;}
		</style>
	</head>
	<body>
		<div class="bw" id="bw" style="height: 169px">
			<div
				style="
					transform-origin: left top;
					transform: scale(0.426768);
					width: 1584px;
					height: 169px;
				"
				id="bs"
			>
				<div class="bn">
					<div class="bg"></div>
					<div class="wm">{{LOGO}}</div>
					<div class="logo">{{LOGO}}</div>
					<div class="stats">
						<div class="stat">
							<div class="sn">Top 2<span style="font-size: 42px">%</span></div>
							<div class="sl">Global Ranking<br />TryHackMe</div>
						</div>
						<div class="stat">
							<div class="sn">
								1<span
									style="font-size: 42px; vertical-align: super; line-height: 0"
									>st</span
								>
							</div>
							<div class="sl">Class BSc CS<br />KCL</div>
						</div>
						<div class="stat">
							<div class="sn">100<span style="font-size: 42px">+</span></div>
							<div class="sl">Rooms Completed<br />TryHackMe</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<script>
			(function () {
				var bw = document.getElementById("bw"),
					bs = document.getElementById("bs");
				var s = (bw.offsetWidth || 680) / 1584;
				bs.style.transform = "scale(" + s + ")";
				bs.style.width = "1584px";
				bw.style.height = 396 * s + "px";
				bs.style.height = 396 * s + "px";
			})();
		</script>
	</body>
</html>
