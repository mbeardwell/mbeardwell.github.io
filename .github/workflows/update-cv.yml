name: Update CV
permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Every midnight UTC

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build
        run: |
          npm install
          npm run generate-cv
          git diff --quiet && echo "No changes to commit" || (
            git config user.email cv-bot@users.noreply.github.com
            git config user.name cv-bot
            git add --all
            git commit -m "CV-Bot — Updated CV"
            git push
          )

      - name: Copy CV files
        run: |
            mkdir -p dist/docs/
            cp public/docs/cv.pdf dist/docs/
            cp public/docs/cv.png dist/docs/ || true

      - name: Deploy CV
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/docs/
          publish_branch: gh-pages
          destination_dir: .
          keep_files: true
