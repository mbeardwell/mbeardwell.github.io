name: Update CV PDF from Google Docs
permissions:
  contents: write
  
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Every midnight UTC

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download latest CV
        run: curl -L "$CV_PDF_URL" -o public/cv.pdf
        env:
          CV_PDF_URL: ${{ secrets.CV_PDF_URL }}

      - name: Commit updated CV
        run: |
          git config user.name "cv-bot"
          git config user.email "cv-bot@users.noreply.github.com"
          git add public/cv.pdf
          git commit -m "Update CV from Google Docs" || echo "No changes"
          git push
