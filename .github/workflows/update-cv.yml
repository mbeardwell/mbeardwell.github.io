name: Update CV
permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Every midnight UTC

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get install -y --no-install-recommends imagemagick texlive-xetex lmodern

      - name: Build 
        run: |
          npm install
          npm run generate-docs
          git diff --quiet && echo "No changes to commit" || (
            git config user.email cv-bot@users.noreply.github.com
            git config user.name cv-bot
            git add --all
            git commit -m "CV-Bot — Updated CVs, cover letters, and their screenshots"
            git push
          )

      - name: Copy CVs, cover letters, and screenshot of them
        run: |
            mkdir -p dist/docs/cv
            cp public/docs/cv/Matthew_Beardwell_*.pdf dist/docs/cv
            cp public/docs/cv/Matthew_Beardwell_*.png dist/docs/cv || true

      - name: Deploy CV
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/docs/cv/
          publish_branch: gh-pages
          destination_dir: .
          keep_files: true
